name: API quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-checks:
    name: Framework checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Static framework checks
        run: ./scripts/check-framework.sh

      - name: Compile and run local framework tests
        run: >-
          ./mvnw --batch-mode --no-transfer-progress clean
          -Dtest=SchemaContractTest,SensitiveDataSanitizerTest test

      - name: Upload framework-check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-check-reports-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/surefire-reports
            target/allure-results
            target/test-run-summary.json
            target/logs

  live-api-tests:
    name: Live API suite
    # Fork PRs cannot read secrets from the upstream repository. Fork owners can
    # create a qa Environment with the two secrets below and use workflow_dispatch.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: framework-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: qa
    env:
      # Keep even public playground credentials in GitHub secrets. Do not commit
      # literal values here; this lets forks and private environments use the same workflow.
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
      API_BASE_URI: ${{ vars.API_BASE_URI }}
      CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js for Allure
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate API secret configuration
        shell: bash
        run: |
          if [[ -z "$BOOKER_USERNAME" || -z "$BOOKER_PASSWORD" ]]; then
            echo "::error::Add BOOKER_USERNAME and BOOKER_PASSWORD to the qa GitHub Environment."
            exit 1
          fi

      - name: Run low-thread API suite
        run: ./mvnw --batch-mode --no-transfer-progress clean test

      - name: Generate Allure HTML report
        if: always()
        run: >-
          npx --yes allure-commandline@2.43.0 generate
          target/allure-results --clean -o target/allure-report

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/surefire-reports
            target/allure-results
            target/allure-report
            target/test-run-summary.json
            target/logs
