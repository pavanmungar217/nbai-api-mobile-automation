name: API automation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Static framework checks
        run: ./scripts/check-framework.sh
      - name: Compile and run local framework tests
        run: ./mvnw --batch-mode --no-transfer-progress clean -Dtest=SchemaContractTest,SensitiveDataSanitizerTest test

  live-api-tests:
    if: github.event_name != 'pull_request'
    needs: framework-checks
    runs-on: ubuntu-latest
    environment: qa
    env:
      BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME }}
      BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD }}
      CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run low-thread API suite
        run: ./mvnw --batch-mode --no-transfer-progress clean test
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/surefire-reports
            target/allure-results
            target/test-run-summary.json
            target/logs
